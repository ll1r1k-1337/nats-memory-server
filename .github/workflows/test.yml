name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Run every leg to completion: the binary is platform-specific, so one
      # OS/Node failure should not mask the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Download the binary in a dedicated, strict step so a download problem is
      # attributed clearly instead of surfacing as an opaque test failure.
      - name: Prefetch NATS server
        run: npm run prefetch
        env:
          NATS_MEMORY_SERVER_STRICT_INSTALL: '1'

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
